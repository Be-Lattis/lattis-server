name: CI

# Sur main et à la demande (tests désactivés sur les PR pour l'instant,
# comme pour lattis-app).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: pg
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
        env:
          LATTIS_TEST_PG_URL: postgres://postgres:pg@127.0.0.1:5432/postgres

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Chart (édition admin et édition web)
        run: |
          set -o pipefail
          V="--set publicURL=https://lattis.example.com --set secrets.existingSecret=s --set secrets.signingKeySecret=k --set secrets.postgresTLSSecret=t --set lattisd.bootstrapOwner=a@example.com"
          helm lint deploy/helm/lattis $V
          helm template t deploy/helm/lattis $V > /dev/null
          helm template t deploy/helm/lattis $V --set web.enabled=true --set web.cache.size=1Gi | tee /tmp/web.yaml | grep -q "kind: NetworkPolicy"
          grep -q "LATTIS_WEB_LAUNCHER" /tmp/web.yaml
          helm template t deploy/helm/lattis $V --set replicas.count=1 | grep -c "fsGroupChangePolicy: OnRootMismatch" | grep -qx 2
      - name: Nouvelle version (chart, lattisd) sans redémarrage de PostgreSQL
        # Nouvelle version du chart et nouvelle image lattisd : les objets
        # PostgreSQL et réplicas ne changent que par leurs labels de version
        # (métadonnées), jamais par leurs pods.
        run: |
          set -o pipefail
          V="--set publicURL=https://lattis.example.com --set secrets.existingSecret=s --set secrets.signingKeySecret=k --set secrets.postgresTLSSecret=t --set lattisd.bootstrapOwner=a@example.com --set replicas.count=1 --set web.enabled=true --set web.cache.size=1Gi"
          PG="--show-only templates/postgres.yaml --show-only templates/replicas.yaml"
          cp -r deploy/helm/lattis /tmp/next
          sed -i 's/^version: .*/version: 99.0.0/; s/^appVersion: .*/appVersion: "99.0.0-beta"/' /tmp/next/Chart.yaml
          helm template t deploy/helm/lattis $V $PG > /tmp/a.yaml
          helm template t /tmp/next $V $PG --set image.lattisd.tag=autre > /tmp/b.yaml
          diff /tmp/a.yaml /tmp/b.yaml | grep '^[<>]' > /tmp/diff.txt || true
          cat /tmp/diff.txt
          if grep -vE '^[<>] {5}(app\.kubernetes\.io/version|helm\.sh/chart): ' /tmp/diff.txt; then
            echo "une nouvelle version change les pods de PostgreSQL (redémarrage)"; exit 1
          fi

  server-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Images
        run: |
          docker build -f docker/server/Dockerfile -t be-lattis/server:dev-pg18 .
          docker build -f docker/lattisd/Dockerfile -t be-lattis/lattisd:dev .
      - name: Docker Compose
        working-directory: deploy/compose
        run: |
          cp .env.example .env
          docker compose up -d --no-build
          for i in $(seq 60); do curl -sf http://localhost:8080/readyz && break; sleep 2; done
          curl -sf http://localhost:8080/readyz
          # Réglages PostgreSQL gérés : appliqués au démarrage, et suivis au redémarrage.
          test "$(docker compose exec -T postgres gosu postgres psql -tAc 'show max_connections')" = 400
          test "$(docker compose exec -T postgres gosu postgres psql -tAc 'show hot_standby_feedback')" = on
          # Clé TLS rendue lisible par le groupe (rattachement de volume) : réparée au démarrage.
          docker compose exec -T postgres sh -c 'chmod 0640 "$PGDATA/server.key"'
          LATTIS_PG_MAX_CONNECTIONS=300 docker compose up -d --no-build postgres
          for i in $(seq 30); do docker compose exec -T postgres gosu postgres pg_isready -q && break; sleep 2; done
          test "$(docker compose exec -T postgres gosu postgres psql -tAc 'show max_connections')" = 300
          docker compose up -d --no-build postgres lattisd
          for i in $(seq 60); do curl -sf http://localhost:8080/readyz && break; sleep 2; done
          docker compose run --rm --no-deps lattisd migrate --status | grep "À jour"
          # Application web désactivée (édition admin) : /app/ refusée.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/app/)" = 404
          # Routes posées après la construction du serveur : présentes au
          # démarrage réel (relais des changements, formulaires).
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/events)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/form-static/form.css)" = 200
          # Logo du serveur (icône Lattis par défaut), aussi en favicon.
          test "$(curl -s -o /dev/null -w '%{http_code} %{content_type}' http://localhost:8080/logo)" = "200 image/png"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/favicon.ico)" = 200
          if curl -s http://localhost:8080/f/inconnu | grep -q '^404 page not found'; then exit 1; fi
      - name: Parcours d'un poste
        run: |
          TOKEN=$(docker compose -f deploy/compose/docker-compose.yml --env-file deploy/compose/.env logs lattisd | grep -o 'token=[0-9a-f]*' | head -1 | cut -d= -f2)
          LATTIS_E2E_LATTISD_URL=http://localhost:8080 LATTIS_E2E_SETUP_TOKEN=$TOKEN \
          LATTIS_E2E_OWNER=vous@example.com go test -count=1 -v -run Compose ./internal/e2e/
      - name: Moteur web (lattis-app, main)
        uses: actions/checkout@v4
        with:
          repository: Be-Lattis/lattis-app
          path: _app
      - name: Édition web
        run: |
          docker build -f _app/build/engine/Dockerfile -t be-lattis/lattis-engine:ci _app
          docker build -f docker/lattisd/Dockerfile --target web --build-arg ENGINE_IMAGE=be-lattis/lattis-engine:ci -t be-lattis/lattisd:web .
          cd deploy/compose
          LATTIS_IMAGE=be-lattis/lattisd:web LATTIS_EDITION=web docker compose up -d --no-build lattisd
          for i in $(seq 60); do curl -sf http://localhost:8080/readyz && break; sleep 2; done
          cd ../..
          LATTIS_E2E_WEB_URL=http://localhost:8080 LATTIS_E2E_OWNER=vous@example.com go test -count=1 -v -run ComposeWeb ./internal/e2e/
      - name: Édition web, mode process isolé (lattisd en root, un UID par moteur)
        run: |
          cat > /tmp/root.yml <<'YAML'
          services:
            lattisd:
              user: "0"
              cap_drop: [ALL]
              cap_add: [SETUID, SETGID, CHOWN, KILL, DAC_OVERRIDE, FOWNER]
          YAML
          cd deploy/compose
          LATTIS_IMAGE=be-lattis/lattisd:web LATTIS_EDITION=web docker compose -f docker-compose.yml -f /tmp/root.yml up -d --no-build lattisd
          for i in $(seq 60); do curl -sf http://localhost:8080/readyz && break; sleep 2; done
          cd ../..
          LATTIS_E2E_WEB_URL=http://localhost:8080 LATTIS_E2E_OWNER=vous@example.com go test -count=1 -v -run ComposeWeb ./internal/e2e/
          ps -eo uid,args | grep '[l]attis-engine --addr'
          ps -eo uid,args | grep '[l]attis-engine --addr' | awk '{ if ($1 < 200000) exit 1 }'
      - name: Édition web, moteurs en conteneurs (mini lanceur)
        run: |
          docker build -f docker/launcher/Dockerfile -t be-lattis/lattis-launcher:dev .
          cd deploy/compose
          export LATTIS_IMAGE=be-lattis/lattisd:web LATTIS_EDITION=web LATTIS_WEB_LAUNCHER=docker             LATTIS_WEB_LAUNCHER_URL=http://launcher:8090 LATTIS_WEB_LAUNCHER_TOKEN_FILE=/etc/lattis/launcher/token             LATTIS_WEB_TOKEN_URL=http://lattisd:8081/engine/token LATTIS_ENGINE_IMAGE=be-lattis/lattis-engine:ci LATTIS_WEB_POOL_SPARE=1
          docker compose --profile docker-engines up -d --no-build launcher lattisd
          for i in $(seq 60); do curl -sf http://localhost:8080/readyz && break; sleep 2; done
          cd ../..
          LATTIS_E2E_WEB_URL=http://localhost:8080 LATTIS_E2E_OWNER=vous@example.com go test -count=1 -v -run ComposeWeb ./internal/e2e/
          docker ps --filter label=lattis.engine=1 --format '{{.Names}}' | grep lattis-engine-
          # Réserve : un moteur prêt en plus de celui attribué.
          for i in $(seq 30); do [ "$(docker ps --filter label=lattis.engine=1 -q | wc -l)" -ge 2 ] && break; sleep 1; done
          docker ps --filter label=lattis.engine=1 --format '{{.Names}}' | grep lattis-engine-pool-
          [ "$(docker ps --filter label=lattis.engine=1 -q | wc -l)" -ge 2 ]
      - if: failure()
        working-directory: deploy/compose
        run: docker compose logs
