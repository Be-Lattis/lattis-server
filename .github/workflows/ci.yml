name: CI

# Sur main et à la demande (tests désactivés sur les PR pour l'instant,
# comme pour lattis-app).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: pg
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
        env:
          LATTIS_TEST_PG_URL: postgres://postgres:pg@127.0.0.1:5432/postgres

  server-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Images
        run: |
          docker build -f docker/server/Dockerfile -t be-lattis/server:dev-pg18 .
          docker build -f docker/lattisd/Dockerfile -t be-lattis/lattisd:dev .
      - name: Docker Compose
        working-directory: deploy/compose
        run: |
          cp .env.example .env
          docker compose up -d --no-build
          for i in $(seq 60); do curl -sf http://localhost:8080/readyz && break; sleep 2; done
          curl -sf http://localhost:8080/readyz
      - name: Parcours d'un poste
        run: |
          TOKEN=$(docker compose -f deploy/compose/docker-compose.yml --env-file deploy/compose/.env logs lattisd | grep -o 'token=[0-9a-f]*' | head -1 | cut -d= -f2)
          LATTIS_E2E_LATTISD_URL=http://localhost:8080 LATTIS_E2E_SETUP_TOKEN=$TOKEN \
          LATTIS_E2E_OWNER=vous@example.com go test -count=1 -v -run Compose ./internal/e2e/
      - name: Moteur web (lattis-app, main)
        uses: actions/checkout@v4
        with:
          repository: Be-Lattis/lattis-app
          path: _app
      - name: Édition web
        run: |
          docker build -f _app/build/engine/Dockerfile -t be-lattis/lattis-engine:ci _app
          docker build -f docker/lattisd/Dockerfile --target web --build-arg ENGINE_IMAGE=be-lattis/lattis-engine:ci -t be-lattis/lattisd:web .
          cd deploy/compose
          LATTIS_IMAGE=be-lattis/lattisd:web LATTIS_EDITION=web docker compose up -d --no-build lattisd
          for i in $(seq 60); do curl -sf http://localhost:8080/readyz && break; sleep 2; done
          cd ../..
          LATTIS_E2E_WEB_URL=http://localhost:8080 LATTIS_E2E_OWNER=vous@example.com go test -count=1 -v -run ComposeWeb ./internal/e2e/
      - if: failure()
        working-directory: deploy/compose
        run: docker compose logs
