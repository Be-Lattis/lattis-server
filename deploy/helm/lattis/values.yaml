# Serveur Lattis (spécification §12 et §20). Les secrets ne sont jamais
# générés par le chart : ils sont créés à part (docs/installation.md §4).

# URL publique de lattisd, émetteur des jetons (obligatoire). Les postes
# l'utilisent pour la découverte ; PostgreSQL la vérifie dans chaque jeton.
publicURL: ""

image:
  lattisd:
    repository: ghcr.io/be-lattis/lattisd
    tag: ""            # appVersion par défaut
  server:
    repository: ghcr.io/be-lattis/server
    tag: "18"
  pullPolicy: IfNotPresent
imagePullSecrets: []

secrets:
  # Secret générique : postgres-password (superutilisateur), service-password
  # (lattis_service), replication-password (lattis_replicator).
  existingSecret: ""
  # Secret contenant signing.pem (clé de signature des jetons, lattisd keygen).
  signingKeySecret: ""
  # Secret TLS (tls.crt, tls.key) du serveur PostgreSQL ; ses noms d'hôte
  # couvrent les adresses publiques en lecture-écriture et en lecture.
  postgresTLSSecret: ""
  # Facultatif : secrets des fournisseurs d'identité (LATTIS_SECRETS_DIR).
  providersSecret: ""

lattisd:
  # Deux lattisd au moins : une mise à jour (ou la perte d'un nœud) ne coupe
  # pas le service. Les mises à jour remplacent un pod à la fois, sans
  # jamais descendre sous replicaCount (docs/mise-a-jour.md §5).
  replicaCount: 2
  # À l'arrêt d'un pod : sortie du service (/readyz en 503), puis
  # shutdownDelay pendant lequel il sert encore (le temps que l'Ingress le
  # retire), puis shutdownGrace pour finir les requêtes en cours.
  shutdownDelay: 5s
  shutdownGrace: 15s
  terminationGracePeriodSeconds: 45
  # Garde au moins un lattisd pendant les opérations sur les nœuds
  # (vidage d'un nœud) quand replicaCount > 1.
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  bootstrapOwner: ""   # adresse du premier propriétaire du serveur
  migrate: true        # migrations au démarrage
  trustProxy: true     # derrière un Ingress
  replicaMaxLag: 10s
  extraEnv: []
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: false
    className: ""
    annotations: {}
    # Édition web avec plusieurs lattisd : une personne doit retrouver le
    # lattisd qui porte son moteur. Avec ingress-nginx, le chart pose une
    # affinité par cookie ; pour un autre contrôleur, mettre false et donner
    # l'équivalent dans annotations.
    stickyWeb: true
    host: ""
    tls: []            # [{secretName: lattis-tls, hosts: [lattis.example.com]}]

postgres:
  database: lattis
  # sslmode annoncé aux postes : verify-full demande un certificat signé par
  # une autorité qu'ils connaissent et qui couvre les adresses publiques.
  clientSSLMode: verify-full
  # Adresse que les postes utilisent pour écrire (découverte, « rw »).
  # Vide : nom DNS du service dans le cluster.
  publicReadWrite: ""  # hôte:port
  service:
    type: ClusterIP    # LoadBalancer pour des postes hors du cluster
    annotations: {}
  persistence:
    size: 20Gi
    storageClass: ""
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

replicas:
  # Réplicas en flux, surveillés par lattisd et annoncés aux postes tant
  # qu'ils suivent le parent (retard < lattisd.replicaMaxLag).
  count: 0
  # Adresses annoncées aux postes, une par réplica (même ordre que les pods).
  # Vide : nom DNS de chaque pod dans le cluster.
  publicEndpoints: []  # ["ro0.example.com:5432", …]
  service:
    type: ClusterIP
    annotations: {}
  persistence:
    size: 20Gi
    storageClass: ""
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

metrics:
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

# Pipelines d'ingestion : volume des fichiers envoyés ou déposés
# (/var/lib/lattis/pipelines). Vide : emptyDir.
pipelines:
  persistentClaim: ""

# Édition web : l'application dans le navigateur. Chaque utilisateur
# connecté reçoit un pod lattis-engine, créé et supprimé par lattisd (droits
# limités aux pods et volumes de l'espace de noms) et rattaché à son pod.
web:
  enabled: false
  engineImage:
    repository: ghcr.io/be-lattis/lattis-engine
    tag: main
  # maxEngines : moteurs en tout (attribués et prêts) ; au-delà, page
  # « Plus de ressources disponibles ». spare : moteurs gardés prêts
  # d'avance (0 : démarrage à la connexion).
  maxEngines: 50
  spare: 0
  idle: 5m
  # Requêtes de chaque pod ; memory est aussi sa limite.
  resources:
    cpu: 250m
    memory: 1Gi
  # Cache de chaque utilisateur : volume persistant (size, ex. 1Gi), sinon
  # emptyDir (perdu à l'arrêt du moteur, rechargé depuis le serveur).
  cache:
    size: ""
    storageClass: ""
  # Seul lattisd joint les moteurs.
  networkPolicy: true
