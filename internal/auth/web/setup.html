{{define "body"}}
{{if .Token}}
<form method="post" action="/setup">
<input type="hidden" name="token" value="{{.Token}}">
<input type="hidden" name="csrf" value="{{.CSRF}}">
<label>Adresse e-mail<input type="email" name="email" value="{{.Email}}" autocomplete="username" required></label>
<label>Nouveau mot de passe ({{.MinLength}} caractères au moins)<input type="password" name="password" autocomplete="new-password" minlength="{{.MinLength}}" required autofocus></label>
<label>Confirmation<input type="password" name="confirm" autocomplete="new-password" required></label>
<button type="submit" class="ok">Enregistrer</button>
</form>
{{with .Links}}<p class="or">Ou, sans mot de passe :</p>
<p class="links">{{range .}}<a class="button" href="{{.URL}}">{{.Label}}</a> {{end}}</p>
<p class="muted">Avec la même adresse e-mail, vos accès vous attendent.</p>{{end}}
{{end}}
{{end}}
