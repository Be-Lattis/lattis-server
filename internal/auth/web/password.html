{{define "body"}}
<form method="post" action="{{.Action}}">
<input type="hidden" name="req" value="{{.Req}}">
<input type="hidden" name="csrf" value="{{.CSRF}}">
<label>Adresse e-mail<input type="email" name="email" value="{{.Email}}" autocomplete="username" required autofocus></label>
<label>Mot de passe<input type="password" name="password" autocomplete="current-password" required></label>
<button type="submit" class="ok">Se connecter</button>
</form>
<p class="hint">Mot de passe oublié ? Demandez un nouveau lien à l'administrateur du serveur.</p>
{{if .Back}}<p><a href="{{.Back}}">Autre moyen de connexion</a></p>{{end}}
{{end}}
